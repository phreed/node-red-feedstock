# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.5"

package:
  name: node-red
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/node-red/-/node-red-${{ version }}.tgz
    sha256: d835861a63ed988c7b93713c7810340ef9988a3313b86f40b08f3e8adcbcd006
    patches:
      # conda-forge nodejs builds can report a prerelease tag in
      # process.version (e.g. v26.8.0-alpha.0.0.0). semver.satisfies() rejects
      # any prerelease against a non-prerelease range, so node-red refuses to
      # start. Pass includePrerelease so the >=22.9.0 floor is honoured without
      # tripping over the tag.
      - patches/0001-accept-prerelease-node-versions.patch

build:
  number: 0
  script: build.nu
  # noarch: generic # has binaries on macos, so not 'noarch'

requirements:
  build:
    - nodejs
    # pnpm 12 replaced the JS entry point with a native binary, and the
    # conda-forge package ships the x86_64 build on every subdir. On
    # linux-aarch64 that fails as "Exec format error (os error 8)" the moment
    # `pnpm install` is spawned; osx-arm64 only survives it via Rosetta. pnpm 11
    # is still bin/pnpm.cjs, a plain Node script, so it runs anywhere.
    # Drop this pin once pnpm-feedstock ships per-platform binaries.
    - pnpm <12
    - pnpm-licenses
    - nushell
  run:
    - nodejs

tests:
  # Test 1: Verify package contents are included
  - package_contents:
      files:
        - if: not win
          then:
            - share/node-red/service.yaml
          else:
            - Library\share\node-red\service.yaml
  # Test 2: Functional tests
  - script:
      content:
        - node-red --help

about:
  homepage: https://nodered.org
  summary: Low-code programming for event-driven applications
  description: |
    Node-RED's goal is to enable anyone to build applications that collect,
      transform and visualize their data;
      building flows that can automate their world.
      Its low-code nature makes it accessible to users of any background,
      whether for home automation,
      industrial control systems or anything in between.
  license: Apache-2.0
  license_file:
    - LICENSE
    # Generated by pnpm-licenses in build.nu; covers the ~280 bundled npm deps.
    - third-party-licenses.txt
  documentation: https://nodered.org/docs/
  repository: https://github.com/node-red/node-red

extra:
  recipe-maintainers:
    - phreed
